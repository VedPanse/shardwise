<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ShardWise — Architecture</title>
<style>
:root{font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,sans-serif;color:#ffffff;background:#000000;color-scheme:dark;font-synthesis:none;--blue:#0071e3;--muted:#86868B}
*{box-sizing:border-box}body{margin:0}button{font:inherit}
main{max-width:1160px;margin:auto;padding:32px}
.canvas{background:#000000;border:0;border-radius:24px;padding:30px 26px;overflow:auto}
.diagram{position:relative;min-width:640px}
.diagram svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.section{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:48px}.section:last-child{padding-bottom:0}
.node{position:relative;z-index:1;text-align:left;border:1px solid #424247;background:#161617;border-radius:14px;padding:18px;min-height:122px;cursor:pointer;transition:border-color .18s,background .18s;box-shadow:0 2px 5px #00000004;width:100%;color:#ffffff}
.node:hover{border-color:#86868b}button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.node.done{border-color:var(--blue);background:#161617}
.node-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tech{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:650}
.check{border:1px solid #737379;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:transparent;flex-shrink:0}
.done .check{background:var(--blue);border-color:var(--blue);color:#fff}
.node strong{display:block;font-size:15px;letter-spacing:-.3px;font-weight:600}
.description{display:block;font-size:11px;line-height:1.5;color:var(--muted);margin-top:6px}
@media(max-width:720px){main{padding:16px}.canvas{padding:22px 18px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.canvas{overflow:visible}main{padding:20px}.node{break-inside:avoid}}
</style>
</head>
<body>
<main aria-label="ShardWise architecture">
<div class="canvas"><div class="diagram" id="diagram"><svg aria-hidden="true" id="lines"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#737379"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0071E3"/></marker></defs><g id="paths"></g></svg></div></div>
</main>
<script>
'use strict';
const groups=[
 {nodes:[['client','curl client','curl / Shell','Submit workflows and look up job status.'],['sdk','Python SDK','Python','Build and submit workflows from Python.']]},
 {nodes:[['api','Job submission API','Rust / Axum','Accept the request and return a job ID.'],['graph','Task graph','Rust','Deserialize, validate, and index dependencies.']]},
 {nodes:[['metadata','Metadata quorum','Rust / Paxos-inspired','Three nodes. Two votes required to commit.'],['scheduler','Dependency scheduler','Rust','Track readiness, completion, and failure.'],['dispatch','Worker dispatch loop','Rust','Assign ready tasks as worker capacity opens.']]},
 {nodes:[['kafka','Task dispatch transport','Kafka','Carry assignments and completion events.']]},
 {nodes:[['worker1','Worker 01','Rust + Python','Rust manages execution. Python runs functions.'],['worker2','Worker 02','Rust + Python','Independent ready tasks run concurrently.'],['worker3','Worker 03','Rust + Python','More capacity across your own machines.']]},
 {nodes:[['artifacts','Replicated artifacts','Rust / Worker disks','Replicate task outputs across worker storage.'],['commit','Commit result references','Rust / Metadata quorum','Record results after required replication.']]},
 {nodes:[['result','Final result collection','Rust','Collect requested outputs and finish the job.'],['status','Job status lookup','Rust / Axum','Retrieve stored status by job ID.']]}
];
const edges=[['client','api'],['sdk','api'],['api','graph'],['graph','metadata'],['metadata','scheduler'],['scheduler','dispatch'],['dispatch','kafka'],['kafka','worker1'],['kafka','worker2'],['kafka','worker3'],['worker1','artifacts'],['worker2','artifacts'],['worker3','artifacts'],['artifacts','commit'],['commit','result'],['result','status']];
const key='shardwise.architecture.complete.v1';
const ids=new Set(groups.flatMap(g=>g.nodes.map(n=>n[0])));
let completed=new Set();
let busy=false;
let loaded=false;
const diagram=document.getElementById('diagram');
for(const group of groups){const section=document.createElement('section');section.className='section';section.style.gridTemplateColumns=`repeat(${group.nodes.length},minmax(0,1fr))`;for(const [id,title,tech,description]of group.nodes){const button=document.createElement('button');button.type='button';button.id=id;button.className='node';button.innerHTML=`<span class="node-top"><span class="tech">${tech}</span><span class="check" aria-hidden="true">✓</span></span><strong>${title}</strong><span class="description">${description}</span>`;button.addEventListener('click',()=>toggle(id));section.append(button);}diagram.append(section);}
async function requestProgress(update){
 const response=await fetch('/api/progress',update?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(update),cache:'no-store'}:{cache:'no-store'});
 if(!response.ok)throw new Error('Progress could not be saved or loaded. Check that serve_diagram.py is running.');
 return response.json();
}
async function sync(initial=false){
 if(busy)return;
 busy=true;
 try{
  let data=await requestProgress();
  if(data.completed===null){
   let previous=[];
   try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))previous=saved.filter(id=>ids.has(id));}catch{}
   data=await requestProgress({initial:previous});
  }
  completed=new Set(data.completed);loaded=true;
 }catch(error){if(initial)alert(error.message);}
 finally{busy=false;render();}
}
async function toggle(id){
 if(busy||!loaded)return;
 busy=true;render();
 try{const data=await requestProgress({id,completed:!completed.has(id)});completed=new Set(data.completed);}
 catch(error){alert(error.message);}
 finally{busy=false;render();}
}
function render(){for(const id of ids){const button=document.getElementById(id);button.classList.toggle('done',completed.has(id));button.setAttribute('aria-pressed',String(completed.has(id)));button.disabled=busy||!loaded;}}
setInterval(()=>{if(!document.hidden)sync();},2000);
window.addEventListener('focus',()=>sync());
sync(true);
function draw(){const bounds=diagram.getBoundingClientRect();const paths=document.getElementById('paths');paths.replaceChildren();for(const [from,to]of edges){const a=document.getElementById(from).getBoundingClientRect();const b=document.getElementById(to).getBoundingClientRect();let d;if(Math.abs(a.top-b.top)<3){const x1=a.right-bounds.left+2,y1=a.top+a.height/2-bounds.top,x2=b.left-bounds.left-3;d=`M ${x1} ${y1} L ${x2} ${y1}`;}else{const x1=a.left+a.width/2-bounds.left,y1=a.bottom-bounds.top+2,x2=b.left+b.width/2-bounds.left,y2=b.top-bounds.top-4;const mid=y1+(y2-y1)*.46;d=`M ${x1} ${y1} L ${x1} ${mid} L ${x2} ${mid} L ${x2} ${y2}`;}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','#737379');path.setAttribute('stroke-width','1.2');path.setAttribute('stroke-linejoin','round');path.setAttribute('marker-end','url(#arrow)');paths.append(path);}
for(const [from,to,side] of [['commit','metadata','left'],['status','client','right']]){
const a=document.getElementById(from).getBoundingClientRect(),b=document.getElementById(to).getBoundingClientRect();
const path=document.createElementNS('http://www.w3.org/2000/svg','path');
let d;
if(side==='left'){const x=-13,y1=a.top+a.height/2-bounds.top,y2=b.top+b.height/2-bounds.top;d=`M ${a.left-bounds.left-2} ${y1} H ${x} V ${y2} H ${b.left-bounds.left-4}`;}
else{const x=bounds.width+13,y1=a.top+a.height/2-bounds.top,y2=b.top-bounds.top-9,tx=b.left+b.width/2-bounds.left;d=`M ${a.right-bounds.left+2} ${y1} H ${x} V ${y2} H ${tx} V ${b.top-bounds.top-3}`;}
path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','#0071E3');path.setAttribute('stroke-width','1');path.setAttribute('stroke-dasharray','3 4');path.setAttribute('marker-end','url(#arrow-blue)');paths.append(path);
}}

render();new ResizeObserver(draw).observe(diagram);requestAnimationFrame(draw);
</script>
</body>
</html>
