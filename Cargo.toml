[package]
name = "shardwise"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
axum = "0.8.9"
mermaid-text = "0.57.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "fast-rng", "macro-diagnostics"] }
